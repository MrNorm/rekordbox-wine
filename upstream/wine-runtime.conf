# The Wine that rekordbox-wine ships inside its own package.
#
# WHY A PINNED WINE. Until 2026-10-17 the package patched whatever Wine the
# distro had installed, and every patched component is linked against Wine
# internals that change between releases. Arch moved wine-staging three times
# in six weeks (2026-08-27, 09-13, 09-28), each time in an ordinary
# `pacman -Syu`, and each time rekordbox broke (THEMES/T14, T15). The package
# now carries a complete Wine at the version below, built with the series, at
# /usr/lib/rekordbox-wine/wine. The distro's Wine can do whatever it likes.
#
# Moving to a new Wine is a deliberate act: change these lines, rebuild, run
# the acceptance tests, and only then record the version in
# upstream/patches/supported-wine.txt.
#
# Sourced by bin/build-wine-runtime.sh as shell. Values only, no logic.
WINE_VER=11.18
WINE_URL=https://dl.winehq.org/wine/source/11.x/wine-11.18.tar.xz
WINE_SHA256=c6282f6d4daecf11f3ab9f9a2b6c598f67be7e28c363ba2cae8a3c44b611e7a4
# wine-staging, because every measurement in this project was made on it.
# The flavour is part of the pin: vanilla 11.18 is a different Wine.
STAGING_URL=https://github.com/wine-staging/wine-staging/archive/refs/tags/v11.18.tar.gz
STAGING_SHA256=be9ab2471ce3ef729484c9d7e2752790a9145e1bb0c0e680f01268d15e5488c5
# Where the runtime lives once installed. The launcher reads the same path.
RUNTIME_PREFIX=/usr/lib/rekordbox-wine/wine
# Wine Mono and Wine Gecko, at exactly the versions this Wine asks for
# (dlls/appwiz.cpl/addons.c: MONO_VERSION, GECKO_VERSION; the sha256s are the
# ones Wine itself checks a download against). Without them every new prefix
# stops on a "Wine Mono Installer" download prompt (THEMES/T21): a distro's
# wine-mono/wine-gecko cannot be installed alongside, they depend on its Wine.
MONO_VER=11.3.0
MONO_SHA256=df2dfc1665c2511882e7cabd56eafd0c0a3d94e5a7e86f969277f6c189d418d3
GECKO_VER=2.47.4
GECKO_X86_SHA256=26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6
GECKO_X86_64_SHA256=e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f
