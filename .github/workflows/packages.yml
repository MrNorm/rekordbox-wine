name: packages

# deb and rpm, built and installed on their own distributions.
#
# These two packaging trees existed for two weeks and had never been built on
# Debian or Fedora -- the README said so. Untested packaging is a claim, not a
# fact, and this project has already paid once for the difference (THEMES/T14).
#
# Since 2026-10-17 each package builds and carries its own pinned Wine
# (upstream/wine-runtime.conf), so a distribution no longer has to be able to
# install that Wine itself, and the WineHQ repositories are not needed. What a
# distribution must supply is a mingw-w64 cross compiler for the build and the
# system libraries the runtime loads.

on:
  push:
    branches: [main, master]
    paths:
      - 'packaging/**'
      - 'bin/**'
      - 'upstream/patches/**'
      - 'upstream/wine-runtime.conf'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'bin/**'
      - 'upstream/patches/**'
  schedule:
    - cron: '41 4 * * 0'   # weekly; the daily Arch build is the fast signal
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` here is bash. GitHub defaults to `sh`, and these scripts use
# `[[ ]]`, arrays and `${var//}` -- bashisms all. That passed on Arch and Fedora
# only because their /bin/sh IS bash; on Debian it is dash, and the marker
# checks failed with "[[: not found" and then reported every file as MISSING
# FROM THE PACKAGE. A verification step that reports absence when it cannot
# parse itself is worse than no verification.
defaults:
  run:
    shell: bash

jobs:
  deb:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 300
    steps:
      - name: Build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git \
            devscripts debhelper build-essential python3 curl flex bison autoconf perl \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils \
            libx11-dev libxext-dev libxrandr-dev libxcomposite-dev libxfixes-dev \
            libxi-dev libxcursor-dev libxinerama-dev libxrender-dev libxxf86vm-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libfreetype-dev libfontconfig-dev libgnutls28-dev libusb-1.0-0-dev \
            libudev-dev libpcap-dev libgl-dev libegl-dev libvulkan-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Record the pinned Wine
        id: wine
        run: . upstream/wine-runtime.conf && echo "version=$WINE_VER" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          # build-deb.sh stages packaging/debian to ./debian first --
          # dpkg-buildpackage requires debian/ at the source root.
          # Into dist/ inside the workspace: upload-artifact rejects any path
          # containing '..', and dpkg writes beside the source tree by default.
          packaging/build-deb.sh dist

      - name: The .deb must contain the patched runtime
        # Markers in the files that ended up inside the package, not in the
        # build tree. Same list as every other job: packaging/verify-tree.sh.
        run: |
          set -euo pipefail
          deb="$(ls dist/rekordbox-wine_*.deb | head -1)"
          echo "inspecting $deb ($(du -h "$deb" | cut -f1))"
          mkdir -p /tmp/x && dpkg-deb -x "$deb" /tmp/x
          packaging/verify-tree.sh /tmp/x

      - name: Install it, and run the launcher's checker
        # Installing for real is what proves the Depends line resolves.
        run: |
          set -euo pipefail
          apt-get install -y -qq ./dist/rekordbox-wine_*.deb
          /usr/share/rekordbox-wine/bin/rbw-runtime-check
          useradd -m tester
          out=$(runuser -u tester -- rekordbox-wine --check 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE "no Wine runtime|from the Wine runtime|in the Wine runtime is stock|system library .* is missing"; then
            echo "::error::the installed launcher rejects its own runtime"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-wine-deb-wine${{ steps.wine.outputs.version }}
          path: dist/rekordbox-wine_*.deb
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
      options: --privileged
    timeout-minutes: 300
    steps:
      - name: Build dependencies
        run: |
          set -euo pipefail
          dnf -y install dnf-plugins-core rpm-build rpmdevtools git tar binutils cpio >/dev/null
          dnf -y install python3 curl flex bison autoconf perl mingw64-gcc mingw32-gcc \
            libX11-devel libXext-devel libXrandr-devel libXcomposite-devel \
            libXfixes-devel libXi-devel libXcursor-devel libXinerama-devel \
            libXrender-devel libXxf86vm-devel libxkbcommon-devel wayland-devel \
            alsa-lib-devel pulseaudio-libs-devel dbus-devel freetype-devel \
            fontconfig-devel gnutls-devel libusb1-devel systemd-devel libpcap-devel \
            libglvnd-devel mesa-libEGL-devel vulkan-headers vulkan-loader-devel \
            gstreamer1-plugins-base-devel >/dev/null

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Record the pinned Wine
        id: wine
        run: . upstream/wine-runtime.conf && echo "version=$WINE_VER" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          packaging/build-rpm.sh dist

      - name: The .rpm must contain the patched runtime
        run: |
          set -euo pipefail
          # Absolute: the subshell below cds into /tmp/x, and a relative
          # dist/... path stops resolving the moment it does.
          rpm_file="$(readlink -f "$(ls dist/rekordbox-wine-*.rpm | grep -v src.rpm | head -1)")"
          echo "inspecting $rpm_file ($(du -h "$rpm_file" | cut -f1))"
          mkdir -p /tmp/x && (cd /tmp/x && rpm2cpio "$rpm_file" | cpio -idm --quiet)
          packaging/verify-tree.sh /tmp/x

      - name: Install it, and run the launcher's checker
        run: |
          set -euo pipefail
          dnf -y install "$(ls dist/rekordbox-wine-*.rpm | grep -v src.rpm | head -1)"
          /usr/share/rekordbox-wine/bin/rbw-runtime-check
          useradd -m tester
          out=$(runuser -u tester -- rekordbox-wine --check 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE "no Wine runtime|from the Wine runtime|in the Wine runtime is stock|system library .* is missing"; then
            echo "::error::the installed launcher rejects its own runtime"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-wine-rpm-wine${{ steps.wine.outputs.version }}
          path: dist/*.rpm
          if-no-files-found: error
