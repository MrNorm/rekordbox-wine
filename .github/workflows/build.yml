name: build

# Builds the Arch package -- which since 2026-10-17 means building the whole
# pinned Wine (upstream/wine-runtime.conf) with the wine-staging patchset and
# our series -- then verifies the patched files INSIDE the finished package,
# installs it, and runs the installed launcher's checker.
#
# Before the runtime was vendored this job built against whatever wine-staging
# Arch shipped that day, because every Wine bump broke users (THEMES/T14). The
# Wine is now pinned, so what this catches is a change in Arch's toolchain or
# libraries that breaks the build, or a runtime that no longer resolves its
# system libraries. Moving the pin is a deliberate commit; wine-watch.yml says
# when there is a newer Wine to try.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly. The Wine is pinned, so only Arch's toolchain and libraries move
    # under this build, and they move slowly.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` here is bash. GitHub defaults to `sh`, and these scripts use
# `[[ ]]`, arrays and `${var//}` -- bashisms all. That passed on Arch and Fedora
# only because their /bin/sh IS bash; on Debian it is dash, and the marker
# checks failed with "[[: not found" and then reported every file as MISSING
# FROM THE PACKAGE. A verification step that reports absence when it cannot
# parse itself is worse than no verification.
defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    # Arch in a container, because the package is an Arch package.
    container:
      image: archlinux:base-devel
      options: --privileged
    # A full WoW64 Wine build on a 4-core runner.
    timeout-minutes: 300

    steps:
      - name: Sync
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          # makepkg's pkgver() counts commits, so a shallow clone produces a
          # version that goes BACKWARDS between runs.
          fetch-depth: 0

      - name: Record the pinned Wine
        id: wine
        run: |
          set -euo pipefail
          . upstream/wine-runtime.conf
          echo "version=$WINE_VER" >> "$GITHUB_OUTPUT"
          echo "pinned runtime: wine $WINE_VER + staging"

      - name: makepkg (unprivileged — makepkg refuses to run as root)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder .
          # makepkg's own dependency install needs root without a password.
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          # The PKGBUILD clones GitHub master, which is not what this run is
          # testing: on a pull request that built the OLD master and passed or
          # failed for the wrong code. Build the commit that was checked out.
          sed -i "s|git+\$url.git|git+file://$GITHUB_WORKSPACE#commit=$(git rev-parse HEAD)|" packaging/PKGBUILD
          grep -q "git+file://" packaging/PKGBUILD || { echo "could not repoint the PKGBUILD source"; exit 1; }
          sudo -u builder bash -c 'cd packaging && makepkg -s --noconfirm --noprogressbar'

      - name: Verify the built package really contains the patches
        # makepkg already ran check() on the BUILD tree. This is the different
        # and stronger claim: the markers are in the files that ended up INSIDE
        # the package. Same list, packaging/verify-tree.sh.
        run: |
          set -euo pipefail
          pkg="$(ls packaging/*.pkg.tar.zst | head -1)"
          echo "inspecting $pkg ($(du -h "$pkg" | cut -f1))"
          mkdir -p /tmp/inspect && tar -C /tmp/inspect -xf "$pkg"
          packaging/verify-tree.sh /tmp/inspect
          # The old payload must be gone: a launcher that found it would be
          # tempted back onto the system-Wine path.
          if [[ -e /tmp/inspect/usr/share/rekordbox-wine/winedll ]]; then
            echo "::error::the package still ships winedll/ from the private-tree design"; exit 1
          fi

      - name: Install the package and run the launcher's own checker
        # Most checks need a desktop session and hardware and will report FAIL
        # here; what is tested is that it RUNS, finds its runtime, and finds
        # every fix in it and every system library the runtime needs.
        run: |
          set -euo pipefail
          pacman -U --noconfirm packaging/*.pkg.tar.zst
          /usr/share/rekordbox-wine/bin/rbw-runtime-check
          /usr/lib/rekordbox-wine/wine/bin/wine --version
          out=$(runuser -u builder -- env HOME=/home/builder rekordbox-wine --check 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE "no Wine runtime|from the Wine runtime|in the Wine runtime is stock|system library .* is missing"; then
            echo "::error::the installed launcher rejects its own runtime"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-wine-arch-wine${{ steps.wine.outputs.version }}
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
