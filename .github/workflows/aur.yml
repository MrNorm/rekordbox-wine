name: aur-publish

# PUBLISHING TO THE AUR — DELIBERATELY MANUAL, AND HERE IS WHY.
#
# This project moved OFF the AUR on 2026-08-20 at the user's request, after AUR
# pushes were blocked over malware injection. A package whose entire argument is
# "you can audit this chain" should not quietly ask you to trust that chain, so
# nothing here runs on a schedule or on a push. It runs when a human dispatches
# it, and only if the repository actually holds an AUR_SSH_KEY secret.
#
# The primary distribution path remains:
#   git clone https://github.com/MrNorm/rekordbox-wine.git
#   cd rekordbox-wine/packaging && makepkg -si
# or a prebuilt package from the release workflow.
#
# WHAT THIS PUBLISHES. packaging/PKGBUILD, the VCS PKGBUILD that clones this
# GitHub repository — so an AUR user still builds from the audited source, and
# the AUR entry is a pointer rather than a second copy of the payload.

on:
  workflow_dispatch:
    inputs:
      pkgbase:
        description: 'AUR package base (the AUR repo name)'
        required: true
        default: 'rekordbox-wine-git'
      dry_run:
        description: 'Generate and print .SRCINFO, push nothing'
        type: boolean
        default: true

# Every `run:` here is bash. GitHub defaults to `sh`, and these scripts use
# `[[ ]]`, arrays and `${var//}` -- bashisms all. That passed on Arch and Fedora
# only because their /bin/sh IS bash; on Debian it is dash, and the marker
# checks failed with "[[: not found" and then reported every file as MISSING
# FROM THE PACKAGE. A verification step that reports absence when it cannot
# parse itself is worse than no verification.
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Refuse early if the secret is absent
        # Better than failing on `git push` after doing all the work, and it
        # documents the opt-in: no secret, no AUR.
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY:-}" && '${{ inputs.dry_run }}' != 'true' ]]; then
            echo "::error::No AUR_SSH_KEY secret. Add one, or run with dry_run=true."
            exit 1
          fi

      - run: |
          set -euo pipefail
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Generate .SRCINFO
        # makepkg refuses to run as root, and --printsrcinfo runs pkgver(),
        # which needs the git checkout to be readable by the build user.
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder .
          git config --global --add safe.directory '*'
          runuser -u builder -- bash -c 'cd packaging && makepkg --printsrcinfo' > /tmp/.SRCINFO
          echo '--- .SRCINFO ---'
          cat /tmp/.SRCINFO

      - name: Push to the AUR
        if: inputs.dry_run != true
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          PKGBASE: ${{ inputs.pkgbase }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            IdentitiesOnly yes
          EOF
          git config --global user.name  'rekordbox-wine CI'
          git config --global user.email 'ci@users.noreply.github.com'

          git clone "ssh://aur@aur.archlinux.org/${PKGBASE}.git" /tmp/aur
          cp packaging/PKGBUILD /tmp/aur/PKGBUILD
          cp packaging/rekordbox-wine.install /tmp/aur/rekordbox-wine.install
          cp /tmp/.SRCINFO /tmp/aur/.SRCINFO
          cd /tmp/aur
          # The AUR rejects a push whose .SRCINFO does not match the PKGBUILD,
          # and an empty commit is a wasted round trip.
          if git diff --quiet && git diff --cached --quiet; then
            echo "nothing changed; not pushing"; exit 0
          fi
          git add -A
          git commit -m "rekordbox-wine ${{ github.sha }}"
          git push origin master
