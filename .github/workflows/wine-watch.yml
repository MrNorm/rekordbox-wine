name: wine-watch

# Says when there is a newer Wine than the one the package carries.
#
# Before 2026-10-17 this was an alarm: the package patched the system Wine, so a
# new Arch wine-staging meant rekordbox would stop opening (THEMES/T14). The
# package now carries its own pinned Wine (upstream/wine-runtime.conf), so a
# newer system Wine affects nobody. This is now a to-do: a newer Wine may carry
# fixes worth having, and moving the pin is a deliberate, measured step.
#
# It keeps ONE issue and edits it, rather than filing a new issue a week.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# Every `run:` here is bash. GitHub defaults to `sh`, and these scripts use
# `[[ ]]`, arrays and `${var//}` -- bashisms all. That passed on Arch and Fedora
# only because their /bin/sh IS bash; on Debian it is dash, and the marker
# checks failed with "[[: not found" and then reported every file as MISSING
# FROM THE PACKAGE. A verification step that reports absence when it cannot
# parse itself is worse than no verification.
defaults:
  run:
    shell: bash

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask Arch what wine-staging is today
        id: arch
        run: |
          set -euo pipefail
          # wine-staging lives in [extra]. It was [community] historically and
          # this job first asked [multilib] — which 404s, because multilib holds
          # the lib32-* dependencies rather than wine itself. Try the plausible
          # repos rather than hardcoding one, so a future move is a slower answer
          # and not a red pipeline that says nothing about Wine.
          ver=""
          for repo in extra multilib core; do
            if curl -fsSL "https://archlinux.org/packages/$repo/x86_64/wine-staging/json/" > /tmp/arch.json 2>/dev/null; then
              # pkgver is "11.16". pkgrel is packaging-only and does not move
              # Wine, so comparing it would cry wolf on every rebuild.
              ver="$(python3 -c 'import json;print(json.load(open("/tmp/arch.json"))["pkgver"])')"
              echo "found wine-staging in [$repo]"
              break
            fi
          done
          if [[ -z "$ver" ]]; then
            echo "::error::could not find wine-staging in any known Arch repo — has it moved or been renamed?"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Arch wine-staging: $ver"

      - name: Compare against the pinned runtime
        id: cmp
        run: |
          set -euo pipefail
          ver='${{ steps.arch.outputs.version }}'
          . upstream/wine-runtime.conf
          echo "pinned=$WINE_VER" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == "$WINE_VER" ]]; then
            echo "drifted=no" >> "$GITHUB_OUTPUT"
            echo "the pinned runtime is Arch's current wine-staging, $ver"
          else
            echo "drifted=yes" >> "$GITHUB_OUTPUT"
            echo "Arch has wine-staging $ver; the package carries $WINE_VER"
          fi

      - name: File or update the one standing issue
        if: steps.cmp.outputs.drifted == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.arch.outputs.version }}
          PINNED: ${{ steps.cmp.outputs.pinned }}
        run: |
          set -euo pipefail
          title="Newer Wine available: wine-staging $VER (the package carries $PINNED)"
          {
            echo "Arch's \`wine-staging\` is now **$VER**. The rekordbox-wine package carries its"
            echo "own Wine, **$PINNED** (\`upstream/wine-runtime.conf\`), so **no user is affected**:"
            echo "rekordbox does not use the system Wine."
            echo
            echo "## Moving the pin, if it is worth it"
            echo
            echo "1. Set WINE_VER, the two URLs and both sha256 sums in \`upstream/wine-runtime.conf\`."
            echo "2. \`bin/build-wine-runtime.sh build/runtime\`. A patch that no longer applies,"
            echo "   or applies with unreviewed fuzz, stops the build and names the hunk."
            echo "3. Compiling is not working. Run rekordbox on the hardware, and record what"
            echo "   was measured in \`upstream/patches/supported-wine.txt\` before publishing."
          } > /tmp/body.md

          existing="$(gh issue list --state open --limit 100 --json number,title \
                      --jq '[.[] | select(.title | startswith("Newer Wine available:") or startswith("Wine drift:")) | .number] | first // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --title "$title" --body-file /tmp/body.md
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body-file /tmp/body.md
          fi

      - name: Close the standing issue once the pin has caught up
        if: steps.cmp.outputs.drifted == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.arch.outputs.version }}
        run: |
          set -euo pipefail
          n="$(gh issue list --state open --limit 100 --json number,title \
               --jq '[.[] | select(.title | startswith("Newer Wine available:") or startswith("Wine drift:")) | .number] | first // empty')"
          if [[ -n "$n" ]]; then
            gh issue close "$n" --comment "The package now carries wine-staging $VER."
          fi
